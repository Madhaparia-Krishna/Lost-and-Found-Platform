<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost@Campus - Profile</title>
    <link rel="stylesheet" href="shared-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .profile-container {
            padding: var(--spacing-md);
            background-color: var(--light-color);
            min-height: calc(100vh - var(--status-bar-height) - var(--navbar-height));
        }

        .profile-header {
            background: white;
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-xxl);
            font-weight: 700;
            margin: 0 auto var(--spacing-md);
        }

        .profile-name {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: var(--spacing-xs);
        }

        .profile-role {
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: var(--font-size-sm);
            font-weight: 500;
            text-transform: uppercase;
            display: inline-block;
        }

        .role-panels {
            margin-bottom: var(--spacing-md);
        }

        .admin-panel-access,
        .security-panel-access {
            background: white;
            border-radius: var(--border-radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .admin-panel-access {
            background-color: #f9e2e2;
            border-left: 4px solid #dc3545;
        }

        .security-panel-access {
            background-color: #3a5683;
            color: white;
        }

        .panel-access-btn {
            background-color: #dc3545;
            color: white;
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-sm);
            cursor: pointer;
            transition: all 0.2s;
        }

        .panel-access-btn.security-btn {
            background-color: #2c3e50;
        }

        .panel-access-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .profile-form {
            background: white;
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-md);
        }

        .profile-form h2 {
            font-size: var(--font-size-xl);
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .readonly-field {
            background-color: var(--gray-100);
            color: var(--gray-600);
            cursor: not-allowed;
        }

        .readonly-note {
            font-size: var(--font-size-xs);
            color: var(--gray-500);
            margin-top: var(--spacing-xs);
        }

        .form-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .btn-update {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: var(--spacing-md);
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
        }

        .btn-update:hover {
            background-color: var(--danger-color);
        }

        .btn-secondary {
            background-color: var(--gray-600);
            color: white;
            border: none;
            padding: var(--spacing-md);
            border-radius: var(--border-radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-xs);
        }

        .btn-secondary:hover {
            background-color: var(--gray-700);
        }

        .logout-section {
            background: white;
            border-radius: var(--border-radius-md);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .logout-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--border-radius-sm);
            font-size: var(--font-size-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            width: 100%;
            justify-content: center;
        }

        .logout-btn:hover {
            background-color: #d44d42;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <span class="status-time">09:41</span>
            </div>
            <div class="status-right">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-three-quarters"></i>
            </div>
        </div>

        <!-- App Bar -->
        <div class="app-bar">
            <button class="app-bar-back" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="app-bar-title">Your Profile</div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <div class="profile-container">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">U</div>
                    <h1 class="profile-name" id="profile-name">User Name</h1>
                    <span class="profile-role" id="profile-role">user</span>
                </div>

                <!-- Role-based access panels -->
                <div class="role-panels" id="role-panels" style="display: none;">
                    <!-- Admin Panel Access -->
                    <div class="admin-panel-access" id="admin-access" style="display: none;">
                        <h3><i class="fas fa-user-shield"></i> Admin Access</h3>
                        <p>You have administrator privileges.</p>
                        <a href="admin-dashboard.html" class="panel-access-btn">
                            <i class="fas fa-cog"></i> Go to Admin Panel
                        </a>
                    </div>

                    <!-- Security Panel Access -->
                    <div class="security-panel-access" id="security-access" style="display: none;">
                        <h3><i class="fas fa-shield-alt"></i> Security Access</h3>
                        <p>You have security staff privileges.</p>
                        <a href="security-dashboard.html" class="panel-access-btn security-btn">
                            <i class="fas fa-security"></i> Go to Security Panel
                        </a>
                    </div>
                </div>

                <!-- Profile Form -->
                <div class="profile-form">
                    <h2>Profile Information</h2>
                    
                    <form id="profile-form" data-form-type="profile">
                        <div class="form-group">
                            <label class="form-label" for="name">Full Name</label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="form-input"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="form-input readonly-field"
                                readonly
                            >
                            <div class="readonly-note">Email cannot be changed</div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="admission_number">Admission Number</label>
                            <input 
                                type="text" 
                                id="admission_number" 
                                name="admission_number" 
                                class="form-input"
                                placeholder="e.g. ST/2021/001"
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="faculty_school">Faculty/School</label>
                            <input 
                                type="text" 
                                id="faculty_school" 
                                name="faculty_school" 
                                class="form-input"
                                placeholder="e.g. School of Engineering"
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="year_of_study">Year of Study</label>
                            <select id="year_of_study" name="year_of_study" class="form-input form-select">
                                <option value="">Select Year</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                                <option value="5">5th Year</option>
                                <option value="Masters">Masters</option>
                                <option value="PhD">PhD</option>
                                <option value="Staff">Staff</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="phone_number">Phone Number</label>
                            <input 
                                type="tel" 
                                id="phone_number" 
                                name="phone_number" 
                                class="form-input"
                                placeholder="e.g. +254 700 123 456"
                            >
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-update" id="update-btn">
                                <i class="fas fa-save"></i>
                                Update Profile
                            </button>
                            <a href="dashboard.html" class="btn-secondary">
                                <i class="fas fa-arrow-left"></i>
                                Back to Home
                            </a>
                        </div>
                    </form>
                </div>

                <!-- Logout Section -->
                <div class="logout-section">
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i>
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="shared-scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            const currentUser = mobileApp.getCurrentUser();
            if (!currentUser) {
                window.location.href = 'auth.html';
                return;
            }

            loadProfileData();
            setupForm();
        });

        function loadProfileData() {
            const currentUser = mobileApp.getCurrentUser();
            if (!currentUser) return;

            // Update header
            document.getElementById('profile-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('profile-name').textContent = currentUser.name;
            document.getElementById('profile-role').textContent = currentUser.role;

            // Populate form fields
            document.getElementById('name').value = currentUser.name || '';
            document.getElementById('email').value = currentUser.email || '';
            document.getElementById('admission_number').value = currentUser.admission_number || '';
            document.getElementById('faculty_school').value = currentUser.faculty_school || '';
            document.getElementById('year_of_study').value = currentUser.year_of_study || '';
            document.getElementById('phone_number').value = currentUser.phone_number || '';

            // Show role-based access panels
            showRoleAccess(currentUser.role);
        }

        function showRoleAccess(role) {
            const rolePanels = document.getElementById('role-panels');
            const adminAccess = document.getElementById('admin-access');
            const securityAccess = document.getElementById('security-access');

            if (role === 'admin') {
                rolePanels.style.display = 'block';
                adminAccess.style.display = 'block';
            } else if (role === 'security') {
                rolePanels.style.display = 'block';
                securityAccess.style.display = 'block';
            }
        }

        function setupForm() {
            const form = document.getElementById('profile-form');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const updateBtn = document.getElementById('update-btn');
                const originalText = updateBtn.innerHTML;
                
                // Show loading state
                updateBtn.innerHTML = '<div class="spinner"></div> Updating...';
                updateBtn.disabled = true;
                
                // Simulate API call
                setTimeout(() => {
                    // Reset button
                    updateBtn.innerHTML = originalText;
                    updateBtn.disabled = false;
                    
                    // Handle form submission
                    mobileApp.handleFormSubmission(form);
                    
                    // Reload profile data to reflect changes
                    setTimeout(() => {
                        loadProfileData();
                    }, 1000);
                }, 1500);
            });
        }

        function handleLogout() {
            // Show confirmation
            if (confirm('Are you sure you want to sign out?')) {
                // Show loading message
                mobileApp.showMessage('Signing out...', 'info');
                
                // Sign out after a short delay
                setTimeout(() => {
                    mobileApp.logout();
                }, 1000);
            }
        }
    </script>
</body>
</html>
